<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Ghost text: 顶部冷白高光 → 中段银灰 → 底部蓝紫暗 -->
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#dde2f0" stop-opacity="0.09"/>
      <stop offset="35%"  stop-color="#b0b8cc" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3a3a6e" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Main name: 顶部亮白 → 中段冷银 → 底部蓝紫 -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f0f2ff"/>
      <stop offset="38%"  stop-color="#c8cce0"/>
      <stop offset="100%" stop-color="#7880b0"/>
    </linearGradient>

  </defs>

  <!-- Background -->
  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- Top hairline -->
  <rect width="1200" height="0.5" fill="#ffffff" opacity="0.1"/>

  <!-- Right side: large ghost initial for depth -->
  <text x="740" y="268"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="320"
    font-weight="700"
    letter-spacing="-12"
    fill="url(#ghostGrad)"
    fill-opacity="1">JawQ</text>

  <!-- Eyebrow -->
  <text x="82" y="60"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="10.5"
    font-weight="500"
    letter-spacing="5"
    fill="#8e8e93">PROFILE</text>

  <!-- Name — main -->
  <text x="76" y="188"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="136"
    font-weight="700"
    letter-spacing="-5"
    fill="url(#nameGrad)">JawQ</text>

  <!-- Separator rule -->
  <rect x="80" y="206" width="480" height="0.5" fill="url(#accentLine)"/>

  <!-- Subtitle -->
  <text x="82" y="234"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="12.5"
    font-weight="400"
    letter-spacing="5.5"
    fill="#8e8e93">SOFTWARE ENGINEER</text>

  <!-- Accent dot beside subtitle -->
  <circle cx="72" cy="230" r="2" fill="#ffffff" fill-opacity="0.15"/>

  <!-- Bottom hairline -->
  <rect y="259.5" width="1200" height="0.5" fill="#ffffff" opacity="0.1"/>

</svg>
